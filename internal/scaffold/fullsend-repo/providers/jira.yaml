---
name: jira
type: fullsend-atlassian-cloud
# Workaround: https://github.com/NVIDIA/OpenShell/issues/1978
#
# Credential format: Jira Cloud Basic auth requires a base64-encoded
# "email:api-token" string. Because OpenShell does not yet support
# composite credential injection, provide a single pre-encoded token.
# Generate it with:  printf 'you@example.com:your-api-token' | base64
credentials:
  _NOOP_JIRA: ""
